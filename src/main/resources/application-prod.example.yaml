# ============================================
# iShua Backend — 生产环境配置模板
# ============================================
# 使用方式：复制为 application-prod.yaml，填入实际值
#   cp application-prod.example.yaml application-prod.yaml
#
# 敏感信息（密码/密钥/API Key）必须通过环境变量注入，不写默认值。
# 部署前必须设置的环境变量见下方注释。
# ============================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
    default-models-expand-depth: 3
    doc-expansion: list
    persist-authorization: true
    display-request-duration: true

# ---- JWT ----
jwt:
  secret: ${JWT_SECRET}

# ---- Resend 邮件服务 ----
RESEND_API_KEY: ${RESEND_API_KEY}
RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}

# ---- Cloudflare Turnstile 人机验证 ----
TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}

# ---- iShua 业务配置 ----
ishua:
  ai-import:
    rate-limit:
      max-requests-per-hour: ${AI_IMPORT_RATE_LIMIT_PER_HOUR:20}
    task-timeout-ms: ${AI_IMPORT_TASK_TIMEOUT_MS:1800000}
    cleanup-default-older-than-days: ${AI_IMPORT_CLEANUP_DEFAULT_OLDER_THAN_DAYS:30}
    redis-sync:
      enabled: ${AI_IMPORT_REDIS_SYNC_ENABLED:true}
      interval-ms: ${AI_IMPORT_REDIS_SYNC_INTERVAL_MS:30000}
  filestorage:
    local-dir: ${FILE_UPLOAD_DIR:/data/ishua/upload}
