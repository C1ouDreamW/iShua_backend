# ============================================
# iShua Backend — 公共配置（所有环境共享）
# ============================================
# 环境切换：修改 spring.profiles.active 为 dev 或 prod
#   - dev:  本地开发，所有值在 application-dev.yaml 中硬编码，零环境变量
#   - prod: 生产部署，敏感信息通过环境变量注入
# ============================================

spring:
  profiles:
    active: dev   # <-- 本地默认 dev，部署时改为 prod 或通过 --spring.profiles.active=prod 覆盖

  application:
    name: ishua-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      timeout: 3s
      repositories:
        enabled: false

server:
  port: 8080

stream-task:
  enabled: true
  stream-key: ishua:task:stream
  group: ishua-ai-workers
  consumer:
    enabled: false
  recovery:
    enabled: false
  idempotent:
    enabled: false
  admin:
    enabled: false

jwt:
  expiration: 864000000

springdoc:
  default-flat-param-object: true
  override-with-generic-response: false
