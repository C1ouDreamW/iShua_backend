# ============================================
# iShua Backend — 开发环境配置模板
# ============================================
# 使用方式：复制为 application-dev.yaml，填入本地实际值
#   cp application-dev.example.yaml application-dev.yaml
# ============================================

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ishua_backend?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    default-models-expand-depth: 3
    doc-expansion: list
    persist-authorization: true
    display-request-duration: true

# ---- JWT ----
jwt:
  secret: <填写一个足够长的随机字符串>

# ---- Resend 邮件服务 ----
RESEND_API_KEY: <填写 Resend API Key>
RESEND_FROM_EMAIL: "iShua <noreply@your-domain.com>"

# ---- Cloudflare Turnstile 人机验证 ----
TURNSTILE_SITE_KEY: <填写 Turnstile Site Key>
TURNSTILE_SECRET_KEY: <填写 Turnstile Secret Key>

# ---- iShua 业务配置 ----
ishua:
  ai-import:
    rate-limit:
      max-requests-per-hour: 5
    task-timeout-ms: 1800000
    cleanup-default-older-than-days: 7
    redis-sync:
      enabled: true
      interval-ms: 30000
  filestorage:
    local-dir: ./data/upload
