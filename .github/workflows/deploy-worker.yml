name: Deploy AI Worker

on:
  push:
    branches:
      - main
    paths:
      - 'ai-import-worker/**'

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build & Deploy AI Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ai-import-worker
          push: true
          tags: |
            ghcr.io/c1oudreamw/ishua-ai-worker:latest
            ghcr.io/c1oudreamw/ishua-ai-worker:${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H heycloudream.cn >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh root@heycloudream.cn "cd /opt/ishua/ai-worker && docker-compose pull && docker-compose up -d && docker image prune -f"
