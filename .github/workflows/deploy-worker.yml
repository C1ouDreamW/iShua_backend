name: Deploy AI Worker

on:
  push:
    branches:
      - main
    paths:
      - 'ai-import-worker/**'

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build & Deploy AI Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ai-import-worker
          push: true
          tags: |
            ghcr.io/c1oudreamw/ishua-ai-worker:latest
            ghcr.io/c1oudreamw/ishua-ai-worker:${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H heycloudream.cn >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh root@heycloudream.cn 'bash -se' <<'EOF'
            cd /opt/ishua/ai-worker

            # docker-compose v1（1.29.2）已与新版 Docker Engine 不兼容（报错 KeyError: 'ContainerConfig'）
            # 这里确保使用 Docker Compose v2 插件，缺失时自动安装
            if ! docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi

            for attempt in 1 2 3; do
              if docker compose pull; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Failed to pull worker image after 3 attempts" >&2
                exit 1
              fi

              echo "Image pull failed (attempt $attempt/3), retrying in 10 seconds..." >&2
              sleep 10
            done

            docker compose up -d --remove-orphans
            docker image prune -f
          EOF
